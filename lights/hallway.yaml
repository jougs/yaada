  C:BTI_downstairs_hallway_sewing_machine:   {state:  on}
  C:BH_downstairs_hallway_stele_1:           {state:  on, brightness: 255, rgbw_color: [255, 224, 160, 196]}
  C:BH_downstairs_hallway_stele_2:           {state:  on, brightness: 255, rgbw_color: [255, 224, 160, 196]}
  C:BH_downstairs_hallway_stele_3:           {state:  on, brightness: 255, rgbw_color: [255, 224, 160, 196]}
  C:BH_downstairs_hallway_stele_4:           {state:  on, brightness: 255, rgbw_color: [255, 224, 160, 196]}
  C:BH_downstairs_hallway_stele_5:           {state:  on, brightness: 255, rgbw_color: [255, 224, 160, 196]}
  C:BH_downstairs_hallway_stele_6:           {state:  on, brightness: 255, rgbw_color: [255, 224, 160, 196]}
  C:BH_downstairs_hallway_stele_7:           {state:  on, brightness: 255, rgbw_color: [255, 224, 160, 196]}
  C:BH_downstairs_hallway_up_down_1:         {state:  on, brightness: 255}
  C:BH_downstairs_hallway_up_down_2:         {state:  on, brightness: 255}
  C:BH_downstairs_hallway_up_down_3:         {state:  on, brightness: 255}
  C:UTL_guest_bathroom_skylight:             {state:  on, brightness: 255}
  C:BH_hallway_stairs:                       {state:  on, brightness: 255}
  C:UTI_upstairs_hallway_apothecary_cabinet: {state:  on}
  C:UTL_upstairs_hallway_corner:             {state:  on, brightness: 255, rgbw_color: [255, 224, 160, 0]}
