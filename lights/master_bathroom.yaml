area: master_bathroom
area_friendly: Master bathroom

all_lights_full_on:
  C:BTL_master_bathroom_bath_tub:            {state:  on, brightness: 255}
  C:BTL_master_bathroom_below_vanity:        {state:  on, brightness: 255}
  C:BTL_master_bathroom_mirror:              {state:  on, brightness: 255}
  C:BTL_master_bathroom_shower:              {state:  on, brightness: 255}
  C:BTL_master_bathroom_shower_recess:       {state:  on, brightness: 255}
  C:BTL_master_bathroom_throne:              {state:  on, brightness: 255}
  C:BTL_master_bathroom_vanity:              {state:  on, brightness: 255}
  C:BTL_master_bathroom_vanity_recess_left:  {state:  on, brightness: 255}
  C:BTL_master_bathroom_vanity_recess_right: {state:  on, brightness: 255}

scenes:
  - name: ambient
    friendly_name: Ambient
    icon: mdi:weather-night
    lights:
      C:BTL_master_bathroom_below_vanity:        {state:  on, brightness: 128}
      C:BTL_master_bathroom_shower_recess:       {state:  on, brightness: 128}
      C:BTL_bedroom_floor:                {state:  on, brightness:  64}
  - name: bathroom_vanity
    friendly_name: Bathroom vanity
    replaces: [bathroom_throne, bathroom_shower, master_bathroom_all_on]
    icon: mdi:mirror-rectangle
    lights:
      C:BTL_master_bathroom_bath_tub:            {state:  on, brightness: 32}
      C:BTL_master_bathroom_mirror:              {state:  on, brightness: 255}
      C:BTL_master_bathroom_shower:              {state:  on, brightness: 32}
      C:BTL_master_bathroom_throne:              {state:  on, brightness: 128}
      C:BTL_master_bathroom_vanity:              {state:  on, brightness: 255}
  - name: bathroom_shower
    friendly_name: Bathroom shower
    replaces: [bathroom_throne, bathroom_vanity, master_bathroom_all_on]
    icon: mdi:shower-head
    lights:
      C:BTL_master_bathroom_bath_tub:            {state:  on, brightness:  32}
      C:BTL_master_bathroom_mirror:              {state:  on, brightness:  64}
      C:BTL_master_bathroom_shower:              {state:  on, brightness: 255}
      C:BTL_master_bathroom_shower_recess:       {state:  on, brightness: 128}
      C:BTL_master_bathroom_throne:              {state:  on, brightness: 128}
      C:BTL_master_bathroom_vanity:              {state:  on, brightness:  64}
  - name: bathroom_vanity_recess_left
    friendly_name: Bathroom vanity recess left
    icon: mdi:compare
    depends_any: [bathroom_throne, bathroom_vanity, bathroom_shower]
    lights:
      C:BTL_master_bathroom_vanity_recess_left:  {state:  on, brightness: 255}
  - name: bathroom_vanity_recess_right
    friendly_name: Bathroom vanity recess right
    icon: mdi:compare
    depends_any: [bathroom_throne, bathroom_vanity, bathroom_shower]
    lights:
      C:BTL_master_bathroom_vanity_recess_right:  {state:  on, brightness: 255}
  - name: bathroom_throne
    friendly_name: Bathroom throne
    replaces: [bathroom_shower, bathroom_vanity, master_bathroom_all_on]
    icon: mdi:toilet
    lights:
      C:BTL_master_bathroom_bath_tub:            {state:  on, brightness:  32}
      C:BTL_master_bathroom_mirror:              {state:  on, brightness:  32}
      C:BTL_master_bathroom_shower:              {state:  on, brightness:  32}
      C:BTL_master_bathroom_throne:              {state:  on, brightness: 196}
      C:BTL_master_bathroom_vanity:              {state:  on, brightness:  64}
  - name: master_bathroom_all_on
    replaces: [bathroom_throne, bathroom_shower, bathroom_vanity]

buttons:
  laundry_room_bathroom_door_bottom_short:
    turn_on: bathroom_throne
    turn_off: [bathroom_shower, bathroom_throne, bathroom_vanity, master_bathroom_all_on]
  master_bathroom_bedroom_door_short:
    turn_on: bathroom_throne
    turn_off: [bathroom_shower, bathroom_throne, bathroom_vanity, master_bathroom_all_on]
  master_bathroom_bedroom_door_long: master_bathroom_all_on
  master_bathroom_vanity_short:
    cycle: [bathroom_vanity, bathroom_shower]

switches:
  C:BTI_bathroom_vanity_recess_left: bathroom_vanity_recess_left
  C:BTI_bathroom_vanity_recess_right: bathroom_vanity_recess_right
