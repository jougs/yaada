area: master_bedroom
area_friendly: Master bedroom

all_lights_full_on:
  bedroom_bedside_left:         {state: on, brightness: 255, xy_color: [0.358, 0.346]}
  bedroom_bedside_right:        {state: on, brightness: 255, xy_color: [0.358, 0.346]}
  C:BTL_master_bedroom_floor:   {state: on, brightness: 255}
  C:BTI_bedroom_gift_box:       {state: on}
  C:BTI_bedroom_rubber_tree:    {state: on}

scenes:
  - name: ambient
    friendly_name: Ambient
    icon: mdi:weather-night
    lights:
      C:BTL_master_bedroom_floor:    {state: on, brightness:  64}
      C:BTI_bedroom_gift_box:        {state: on}
  - name: master_bedroom_main
    friendly_name: Bedroom main
    replaces: [master_bedroom_reading]
    icon: mdi:lightbulb
    lights:
      bedroom_bedside_left:          {state: on, brightness: 196, xy_color: [0.491, 0.39]}
      bedroom_bedside_right:         {state: on, brightness: 196, xy_color: [0.491, 0.39]}
      C:BTL_master_bedroom_floor:    {state: on, brightness: 196}
      C:BTI_bedroom_gift_box:        {state: on}
      C:BTI_bedroom_rubber_tree:     {state: on}
  - name: master_bedroom_reading
    friendly_name: Bedroom reading
    replaces: [master_bedroom_main]
    icon: mdi:book-open-variant
    lights:
      bedroom_bedside_left:          {state:  on, brightness: 128, xy_color: [0.491, 0.39]}
      bedroom_bedside_right:         {state:  on, brightness: 128, xy_color: [0.491, 0.39]}

buttons:
  master_bedroom_balcony_door_top_right_short: master_bedroom_main
  master_bedroom_bathroom_door_short: master_bedroom_main
  master_bedroom_bedside_door_left_short: master_bedroom_reading
  master_bedroom_bedside_door_right_short: master_bedroom_main
  master_bedroom_bedside_window_left_short: master_bedroom_main
  master_bedroom_bedside_window_right_short: master_bedroom_reading
  master_bedroom_hallway_door_top_short: master_bedroom_main
