    name: "${friendly_name} RSSI"
    id: sensor_rssi
    update_interval: 90s
    entity_category: "diagnostic"
  - platform: uptime
    name: "${friendly_name} Uptime"
    id: sensor_uptime
    update_interval: 300s
    entity_category: "diagnostic"
