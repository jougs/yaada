esphome:
  name: "${esp_name}"
  friendly_name: "${friendly_name}"
  area: "${area}"
  name_add_mac_suffix: false
  
esp8266:
  board: nodemcuv2

logger:
#  level: WARN

api:
  encryption:
    key: "rNrBBjIRuc9/n0SvNKEK9L6Ip5iBuNlse6Q8/TGbqK8="

ota:
  - platform: esphome
    password: "d95beb0c510a00a9ba21a55fe1b94250"

wifi:
  ssid: "m4iot"
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} AP"
    password: !secret wifi_password
  manual_ip:
    static_ip: ${static_ip}
    gateway: 10.5.5.1
    subnet: 255.255.255.0

mdns:

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time

button:
