    name: "Living room ceiling west"
    segments:
      - single_light_id: living_west_1
      - single_light_id: living_west_2
      - single_light_id: living_west_3
      - single_light_id: living_west_4
      - single_light_id: living_west_5
      - single_light_id: living_west_6
  - platform: partition
    name: "Living room ceiling east"
    segments:
      - single_light_id: living_east_1
      - single_light_id: living_east_2
      - single_light_id: living_east_3
