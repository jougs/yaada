i2c:
  sda: 4
  scl: 5
  scan: True

pca9685:
  - id: 'pca9685_0'
    frequency: 1525.88
    address: 0x40
  - id: 'pca9685_1'
    frequency: 1525.88
    address: 0x41

light:
